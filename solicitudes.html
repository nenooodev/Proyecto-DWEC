<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solicitudes de asistencia recibidas por el PTIS, con las urgentes destacadas en primer lugar."
    />
    <meta name="theme-color" content="#f7f8f3" />
    <title>Solicitudes recibidas · Aula Asistencia</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <script type="module" src="js/ui.js" defer></script>
  </head>
  <body class="pagina">
    <a class="saltar" href="#contenido">Saltar al contenido</a>

    <div class="app">
      <header class="barra-superior">
        <a
          class="barra-superior__volver"
          href="inicio-ptis.html"
          aria-label="Volver al inicio del PTIS"
        >
          <img src="assets/icons/volver.svg" alt="" />
        </a>
        <h1 class="barra-superior__titulo">Solicitudes</h1>
      </header>

      <main class="app__main solicitudes" id="contenido">
        <header class="solicitudes__resumen">
          <h2 class="solicitudes__titulo">4 solicitudes pendientes</h2>
          <p class="solicitudes__subtitulo">1 solicitud urgente</p>
        </header>

        <div class="solicitudes__urgentes"></div>

        <section class="solicitudes__otras" aria-labelledby="titulo-otras-solicitudes">
          <h2 class="solicitudes__etiqueta" id="titulo-otras-solicitudes">
            Otras solicitudes
          </h2>

          <ul class="solicitudes__lista"></ul>
        </section>
      </main>

      <footer class="app__footer">
        <nav class="nav" aria-label="Navegación principal">
          <ul class="nav__lista">
            <li class="nav__item">
              <a class="nav__enlace" href="inicio-ptis.html">
                <span class="nav__caja-icono">
                  <img src="assets/icons/nav-inicio-inactivo.svg" alt="" />
                </span>
                <span class="nav__texto">Inicio</span>
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__enlace nav__enlace--activo"
                href="solicitudes.html"
                aria-current="page"
              >
                <span class="nav__caja-icono">
                  <img src="assets/icons/solicitudes.svg" alt="" />
                </span>
                <span class="nav__texto">Solicitudes</span>
              </a>
            </li>
            <li class="nav__item">
              <a class="nav__enlace" href="horario.html">
                <span class="nav__caja-icono">
                  <img src="assets/icons/nav-horario.svg" alt="" />
                </span>
                <span class="nav__texto">Horario</span>
              </a>
            </li>
            <li class="nav__item">
              <a class="nav__enlace" href="perfil-ptis.html">
                <span class="nav__caja-icono">
                  <img src="assets/icons/nav-perfil.svg" alt="" />
                </span>
                <span class="nav__texto">Perfil</span>
              </a>
            </li>
          </ul>
        </nav>
      </footer>
    </div>
