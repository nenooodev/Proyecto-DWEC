<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f8f3" />
    <title>Contacto con soporte · Aula Asistencia</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="pagina">
    <a class="saltar" href="#contenido">Saltar al contenido</a>

    <div class="app">
      <main class="app__main soporte" id="contenido">
        <header class="soporte__cabecera">
          <h1 class="soporte__titulo">¿Necesitas ayuda?</h1>
          <p class="soporte__texto">Escríbenos y te responderemos lo antes posible.</p>
        </header>

        <section class="soporte__tarjeta" aria-labelledby="contacto-titulo">
          <div class="soporte__encabezado">
            <span class="soporte__icono" aria-hidden="true">
              <img src="assets/icons/asistencia.svg" alt="" />
            </span>
            <h2 class="soporte__titulo-tarjeta" id="contacto-titulo">
              Contacta con el equipo
            </h2>
          </div>

          <form
            class="soporte__formulario"
            action="#"
            method="post"
            id="formulario-contacto"
            novalidate
          >
            <div class="campo">
              <label class="campo__etiqueta" for="nombre">Nombre completo</label>
              <input
                class="campo__entrada"
                id="nombre"
                name="nombre"
                type="text"
                placeholder="Marta Sánchez"
                autocomplete="name"
                maxlength="80"
                aria-describedby="error-nombre"
                aria-invalid="false"
                required
              />
              <p class="campo__error" id="error-nombre" hidden></p>
            </div>

            <div class="campo">
              <label class="campo__etiqueta" for="correo">Correo electrónico</label>
              <input
                class="campo__entrada"
                id="correo"
                name="correo"
                type="email"
                placeholder="marta@correo.com"
                autocomplete="email"
                maxlength="254"
                aria-describedby="error-correo"
                aria-invalid="false"
                required
              />
              <p class="campo__error" id="error-correo" hidden></p>
            </div>

            <div class="campo">
              <label class="campo__etiqueta" for="telefono">Teléfono</label>
              <input
                class="campo__entrada"
                id="telefono"
                name="telefono"
                type="tel"
                placeholder="612345678"
                autocomplete="tel"
                maxlength="13"
                aria-describedby="error-telefono"
                aria-invalid="false"
              />
              <p class="campo__error" id="error-telefono" hidden></p>
            </div>

            <div class="soporte__preferencia">
              <input
                class="soporte__preferencia-casilla"
                id="prefiero-llamada"
                name="prefiero_llamada"
                type="checkbox"
              />
              <label class="soporte__preferencia-texto" for="prefiero-llamada">
                Prefiero que me llaméis
              </label>
            </div>

            <div class="campo">
              <label class="campo__etiqueta" for="tipo-motivo">Motivo del mensaje</label>
              <select
                class="campo__entrada campo__entrada--select"
                id="tipo-motivo"
                name="tipo_motivo"
                aria-describedby="error-tipo-motivo"
                aria-invalid="false"
                required
              >
                <option value="">Selecciona un motivo</option>
                <option value="Reportar problema app">Reportar problema app</option>
                <option value="Propuesta de mejora">Propuesta de mejora</option>
              </select>
              <p class="campo__error" id="error-tipo-motivo" hidden></p>
            </div>

            <div class="campo">
              <div class="campo__cabecera">
                <label class="campo__etiqueta" for="mensaje">Motivo de contacto</label>
                <span class="campo__contador" id="contador-mensaje">0/500</span>
              </div>
              <textarea
                class="campo__entrada campo__entrada--area"
                id="mensaje"
                name="mensaje"
                rows="3"
                minlength="20"
                maxlength="500"
                placeholder="Cuéntanos el motivo de tu consulta..."
                data-contador="contador-mensaje"
                aria-describedby="error-mensaje contador-mensaje"
                aria-invalid="false"
                required
              ></textarea>
              <p class="campo__error" id="error-mensaje" hidden></p>
            </div>

            <button class="boton boton--primario" type="submit">Enviar mensaje</button>
            <p class="aviso-exito" id="contacto-exito" role="status" hidden></p>
          </form>
        </section>

        <div class="soporte__enlaces">
          <a class="soporte__volver" href="mensajes-contacto.html">
            <img src="assets/icons/solicitudes.svg" alt="" />
            Ver mensajes enviados
          </a>
          <a class="soporte__volver" href="index.html">
            <img src="assets/icons/volver.svg" alt="" />
            Volver al inicio
          </a>
        </div>
      </main>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
