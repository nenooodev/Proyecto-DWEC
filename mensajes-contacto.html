<!doctype html>
<html lang="es">
  <head>

    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f8f3" />
    <title>Mensajes de contacto · Aula Asistencia</title>
    <link rel="stylesheet" href="css/estilos.css" />

  <body class="pagina">
    <a class="saltar" href="#contenido">Saltar al contenido</a>

    <div class="app">
      <main class="app__main contactos" id="contenido">

            class="barra-superior__volver"
            href="contacto-soporte.html"
            aria-label="Volver al formulario de contacto"

            <img src="assets/icons/volver.svg" alt="" />

          <h1 class="barra-superior__titulo">Mensajes de contacto</h1>

        <h2 class="contactos__titulo">Mensajes recibidos</h2>
        <ul class="contactos__lista" id="lista-contactos"></ul>
        <p class="contactos__vacio" id="contactos-vacio" hidden>

        </p>
      </main>
    </div>

    <script type="module" src="js/main.js"></script>
